# Netlify (test deployment, owner choice 2026-10-19). Netlify runs Next.js through its
# OpenNext adapter automatically: pages and server actions become a Netlify Function,
# middleware (Clerk) becomes an Edge Function. No plugin to install.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Same pnpm that checked the lockfile and built the app before hosting (2026-10-23).
  # The lockfile is format 9 and pnpm-workspace.yaml uses allowBuilds, so pnpm 10 is needed.
  PNPM_VERSION = "10.34.7"
